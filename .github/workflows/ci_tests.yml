name: Integración Continua (Linting Ruff + Tests pytest)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ejecutar-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v6

      - name: Configurar Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias de desarrollo y testing
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Auditoría estática de estilo y calidad (ruff)
        run: |
          ruff check src scripts tests

      - name: Ejecutar suite de pruebas unitarias (pytest)
        run: |
          pytest -k "not (existencia_archivos_procesados or ausencia_cuarentenas_en_produccion or integridad_tabla_maestra_parquet or feature_engineering_relacional_maestro or emt_rotacion_estratificada_y_control_cuota)"
